<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Yu-Gi-Oh! Classic Battle Box</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{--bg:#0e1116;--panel:#171c24;--panel2:#202733;--line:#313a49;--txt:#f4f6f8;--muted:#9da8b8;--gold:#e8c56a;--green:#63d69a;--yellow:#eabf67;--red:#ef7373;--orange:#efa56e}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}
body{min-height:100vh}.app{max-width:880px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(118px + env(safe-area-inset-bottom))}
.kicker{font-size:11px;color:var(--gold);font-weight:800;letter-spacing:.13em}.title{font-size:29px;margin:5px 0 2px}.source{font-size:12px;color:var(--muted);line-height:1.4}
.box{background:var(--panel);border:1px solid var(--line);border-radius:17px;margin:13px 0;overflow:hidden}.pad{padding:14px}
.picker{width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:#fff;padding:12px 42px 12px 13px;position:relative}
.picker:after{content:"⌄";position:absolute;right:15px;top:17px;color:var(--muted)}.pickerName{font-weight:760;font-size:16px}.pickerMeta{font-size:11px;color:var(--muted);margin-top:3px}
.stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.pill{font-size:11px;border:1px solid var(--line);background:#11161d;border-radius:999px;padding:7px 10px;color:var(--muted)}.pill b{color:#fff}.pill.ok b{color:var(--green)}.pill.warn b{color:var(--yellow)}.pill.bad b{color:var(--red)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}label{font-size:10px;color:var(--muted);display:block;margin:0 0 5px 2px}select,input{width:100%;background:var(--panel2);border:1px solid var(--line);color:#fff;border-radius:11px;padding:10px;font:inherit}
.statusbar{margin-top:12px}.track{height:7px;background:#292f39;border-radius:999px;overflow:hidden}.track i{display:block;width:0;height:100%;background:var(--gold);transition:width .25s}.statusText{font-size:11px;color:var(--muted);margin-top:7px;display:flex;justify-content:space-between;gap:12px}
#search{margin:2px 0 12px}.group{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:11px 0;overflow:hidden}.groupHead{padding:10px 12px;font-size:13px;font-weight:750;background:rgba(255,255,255,.025)}
.cardRow{display:grid;grid-template-columns:57px minmax(0,1fr) auto;gap:11px;align-items:center;padding:9px 10px;border-top:1px solid var(--line)}
.thumb{width:53px;height:77px;border-radius:5px;border:1px solid var(--line);background:#0a0d12 center/cover no-repeat;position:relative;overflow:hidden}.thumb.missing:after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-size:24px;color:#586273;background:linear-gradient(145deg,#10151c,#181e27)}
.cardName{font-size:14px;font-weight:690;line-height:1.22}.cardMeta{font-size:10px;color:var(--muted);margin-top:4px}.status{font-size:10px;font-weight:750;margin-top:5px}.s-ok{color:var(--green)}.s-miss{color:#7f8998}.s-work{color:var(--yellow)}.s-temp{color:var(--orange)}.s-err{color:var(--red)}
.qty{display:flex;align-items:center;gap:5px}.qty button{width:29px;height:29px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:#fff;font-size:18px}.qty span{min-width:18px;text-align:center;font-weight:750;font-size:13px}
.bottom{position:fixed;z-index:20;left:0;right:0;bottom:0;border-top:1px solid var(--line);background:rgba(14,17,22,.94);backdrop-filter:blur(18px);padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.bottomIn{max-width:880px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:13px;padding:13px 10px;font:inherit;font-weight:760}.pri{background:var(--gold);color:#18130a}.sec{background:var(--panel2);color:#fff;border:1px solid var(--line)}.warnBtn{background:#2b2420;color:#ffdca0;border:1px solid #5a4432}.pdfAction{grid-column:1/-1}.btn:disabled{opacity:.38}
.sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:40;display:none}.sheetBg.open{display:block}.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82vh;background:#141922;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));overflow:auto}.handle{width:42px;height:5px;background:#4c5563;border-radius:99px;margin:0 auto 12px}.sheetTitle{font-size:20px;font-weight:760;margin:2px 3px 10px}
.deckGroupTitle{font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:800;margin:15px 5px 6px;text-transform:uppercase}.deckItem{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:13px;padding:11px 12px;margin:7px 0}.deckItem b{display:block;font-size:14px}.deckItem small{display:block;color:var(--muted);font-size:10px;margin-top:4px;line-height:1.35}
.pdfDownload{display:none;grid-column:1/-1;text-decoration:none;text-align:center}.pdfDownload.show{display:block}.viewer{position:fixed;z-index:100;inset:0;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));cursor:pointer}.viewer.open{display:flex}.viewer img{display:block;max-width:min(94vw,620px);max-height:90vh;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 18px 42px rgba(0,0,0,.55))}.viewerHint{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));text-align:center;font-size:11px;color:#aab2bf;pointer-events:none}.thumb.hasImage{cursor:zoom-in}.archiveDanger{width:100%;margin-top:12px;padding:10px 12px;border-radius:11px;border:1px solid #633b3b;background:#26191c;color:#ff9a9a;font:inherit;font-size:12px;font-weight:760}.archiveDanger:disabled{opacity:.4}
.toast{position:fixed;z-index:60;left:14px;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));max-width:560px;margin:auto;background:#222a35;border:1px solid #3b4656;border-radius:14px;padding:12px 13px;font-size:12px;display:none;box-shadow:0 12px 35px rgba(0,0,0,.35)}.toast.show{display:block}
@media(max-width:520px){.controls{grid-template-columns:1fr 1fr}.cardRow{grid-template-columns:51px minmax(0,1fr) auto}.thumb{width:47px;height:68px}}
</style>
</head>
<body>
<div class="app">
  <div class="kicker">CLASSIC BATTLE BOX · LIBRARY V0.16</div>
  <h1 id="deckTitle" class="title">Deck laden …</h1>
  <div id="deckSource" class="source"></div>

  <div class="box"><div class="pad">
    <button id="deckPicker" class="picker">
      <div id="pickerName" class="pickerName">Deck auswählen</div>
      <div id="pickerMeta" class="pickerMeta">Quelle und Jahr</div>
    </button>

    <div class="stats">
      <span class="pill">Main <b id="mainCount">–</b></span>
      <span class="pill">Extra <b id="extraCount">–</b></span>
      <span class="pill">Unterschiedlich <b id="uniqueCount">–</b></span>
      <span class="pill">Verfügbar <b id="availableCount">–</b></span><span class="pill">GitHub <b id="archiveCount">–</b></span>
      <span class="pill">Render <b>450 dpi</b></span>
      <span class="pill" id="serverPill">Server <b id="serverState">prüfen …</b></span>
      <span class="pill" id="tokenPill">GitHub-Token <b id="tokenState">prüfen …</b></span>
    </div>

    <div class="controls">
      <div><label>DRUCKFORMAT</label><select id="layout">
        <option value="a3safe">A3 sicher · 18/Bogen</option>
        <option value="a3tight">A3 maximal · 21/Bogen</option>
        <option value="sra3">SRA3 · 25/Bogen</option>
      </select></div>
      <div><label>SCHNITTMARKEN</label><select id="marks"><option value="1">An</option><option value="0">Aus</option></select></div>
    </div>

    <div class="statusbar">
      <div class="track"><i id="progressFill"></i></div>
      <div class="statusText"><span id="progressLabel">Archiv wird geprüft …</span><b id="progressPct"></b></div>
    </div>

    <button id="clearArchive" class="archiveDanger">Kartenarchiv leeren</button>
  </div></div>

  <input id="search" placeholder="Karte suchen …">
  <div id="cardList"></div>
</div>

<div class="bottom"><div class="bottomIn">
  <button id="renderMissing" class="btn sec">Fehlende rendern</button>
  <button id="rerenderDeck" class="btn warnBtn">Deck komplett neu rendern</button>
  <button id="makePdf" class="btn pri pdfAction">PDF erstellen</button>
  <a id="pdfDownload" class="btn sec pdfDownload pdfAction" href="#" target="_blank" rel="noopener">PDF öffnen / herunterladen</a>
</div></div>

<div id="sheetBg" class="sheetBg"><div class="sheet" onclick="event.stopPropagation()">
  <div class="handle"></div>
  <div class="sheetTitle">Deck auswählen</div>
  <input id="deckSearch" placeholder="Deck suchen …">
  <div id="deckItems"></div>
</div></div>

<div id="toast" class="toast"></div>
<div id="viewer" class="viewer" aria-hidden="true">
  <img id="viewerImg" alt="Kartenansicht">
  <div class="viewerHint">Zum Schließen erneut auf die Karte tippen</div>
</div>

<script>
const RENDER_SERVER='https://yugioh-battlebox.onrender.com';
const layouts={
  a3safe:{w:420,h:297,cols:6,rows:3,label:'A3 sicher'},
  a3tight:{w:420,h:297,cols:7,rows:3,label:'A3 maximal'},
  sra3:{w:320,h:450,cols:5,rows:5,label:'SRA3'}
};
let library=null,currentDeck=null,quantities={},assetState=new Map(),tempSources=new Map(),activeJob=null,pollTimer=null,pdfBlobUrl=null;
const SESSION_ASSET_REV=Date.now().toString(36);
const assetRevision=new Map();

const $=id=>document.getElementById(id);
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function keyOf(c){return String(c.key||c.set||c.en).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase()}
function localUrl(c,bust=false){
  const k=keyOf(c);
  const rev=bust?Date.now().toString(36):(assetRevision.get(k)||SESSION_ASSET_REV);
  return `cards/${encodeURIComponent(k)}.png?v=${encodeURIComponent(rev)}`;
}
function sourceText(d){const s=d.source||{};return [s.label||d.category,s.recipe?`„${s.recipe}“`:null,s.year||d.year].filter(Boolean).join(' · ')}
function qty(c){return quantities[c.set||keyOf(c)] ?? Number(c.qty||0)}
function currentCards(){return (currentDeck?.cards||[]).filter(c=>qty(c)>0)}
function copies(){const out=[];const ordered=[...currentCards()].sort((a,b)=>(a.zone==='extra')-(b.zone==='extra'));for(const c of ordered)for(let i=0;i<qty(c);i++)out.push(c);return out}
function toast(t,ms=4200){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),ms)}
function setProgress(p,label){p=Math.max(0,Math.min(1,Number(p)||0));$('progressFill').style.width=(p*100)+'%';$('progressPct').textContent=p?Math.round(p*100)+' %':'';$('progressLabel').textContent=label||''}
function savePrefs(){
  localStorage.setItem('ygo_layout',$('layout').value);
  localStorage.setItem('ygo_marks',$('marks').value);
  if(currentDeck)localStorage.setItem('ygo_deck',currentDeck.id);
  if(currentDeck)localStorage.setItem('ygo_qty_'+currentDeck.id,JSON.stringify(quantities));
}
function loadQty(deck){
  try{quantities=JSON.parse(localStorage.getItem('ygo_qty_'+deck.id)||'{}')}catch{quantities={}}
}
function updateStats(){
  const cards=currentCards();
  const main=cards.filter(c=>c.zone!=='extra').reduce((a,c)=>a+qty(c),0);
  const extra=cards.filter(c=>c.zone==='extra').reduce((a,c)=>a+qty(c),0);
  const available=cards.filter(c=>['ok','temp'].includes(assetState.get(keyOf(c))?.state)).length;
  const github=cards.filter(c=>assetState.get(keyOf(c))?.state==='ok').length;
  $('mainCount').textContent=main;
  $('extraCount').textContent=extra;
  $('uniqueCount').textContent=cards.length;
  $('availableCount').textContent=`${available}/${cards.length}`;
  $('archiveCount').textContent=`${github}/${cards.length}`;
  $('makePdf').disabled=!cards.length || cards.some(c=>!['ok','temp'].includes(assetState.get(keyOf(c))?.state));
  const missing=cards.filter(c=>!['ok','temp'].includes(assetState.get(keyOf(c))?.state)).length;
  $('renderMissing').disabled=!missing || Boolean(activeJob) || !cards.length;
  $('renderMissing').textContent=missing?`${missing} fehlende rendern`:(cards.length?'Alles vorhanden':'Deckliste laden …');
  $('rerenderDeck').disabled=Boolean(activeJob) || !cards.length;
  $('clearArchive').disabled=Boolean(activeJob);
  $('rerenderDeck').textContent=cards.length?`${cards.length} Karten neu rendern`:'Deck komplett neu rendern';
}

async function existsLocal(card,bust=false){
  try{
    const r=await fetch(localUrl(card,bust),{method:'HEAD',cache:'no-store'});
    return r.ok;
  }catch{return false}
}
async function checkAssets(){
  const cards=currentCards();
  if(!cards.length){setProgress(0,'Keine Karten geladen');updateStats();return;}
  let done=0,ok=0;
  setProgress(0,'Archiv wird geprüft …');
  const workers=Array.from({length:Math.min(6,cards.length)},async(_,wi)=>{
    for(let i=wi;i<cards.length;i+=Math.min(6,cards.length)){
      const c=cards[i],k=keyOf(c);
      if(tempSources.has(k)){
        assetState.set(k,{state:'temp'});
        ok++;done++;continue;
      }
      const yes=await existsLocal(c);
      assetState.set(k,{state:yes?'ok':'missing'});
      if(yes)ok++;
      done++;
      setProgress(cards.length?done/cards.length:1,`Archiv prüfen · ${done}/${cards.length}`);
      renderCardList();
    }
  });
  await Promise.all(workers);
  setProgress(1,`${ok}/${cards.length} Karten im Archiv`);
  updateStats();renderCardList();
}
function imageUrl(c){
  const k=keyOf(c),st=assetState.get(k)?.state;
  if(st==='ok')return localUrl(c);
  if(st==='temp')return tempSources.get(k);
  return '';
}
function openViewer(url,name='Karte'){
  if(!url)return;
  $('viewerImg').src=url;
  $('viewerImg').alt=name;
  $('viewer').classList.add('open');
  $('viewer').setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function closeViewer(){
  $('viewer').classList.remove('open');
  $('viewer').setAttribute('aria-hidden','true');
  $('viewerImg').src='';
  document.body.style.overflow='';
}
function statusHtml(c){
  const st=assetState.get(keyOf(c))?.state||'checking';
  if(st==='ok')return '<div class="status s-ok">● vorhanden</div>';
  if(st==='rendering')return '<div class="status s-work">● wird gerendert …</div>';
  if(st==='temp')return '<div class="status s-temp">● gerendert · temporär</div>';
  if(st==='error')return '<div class="status s-err">● Fehler</div>';
  if(st==='checking')return '<div class="status s-work">● wird geprüft …</div>';
  return '<div class="status s-miss">○ fehlt</div>';
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderCardList(){
  if(!currentDeck)return;
  const q=norm($('search').value),host=$('cardList');
  host.innerHTML='';

  const sections=[
    {label:'Monster',filter:c=>c.zone!=='extra'&&(c.type||'Monster')==='Monster'},
    {label:'Zauber',filter:c=>c.zone!=='extra'&&c.type==='Zauber'},
    {label:'Fallen',filter:c=>c.zone!=='extra'&&c.type==='Falle'},
    {label:'Extra Deck',filter:c=>c.zone==='extra'}
  ];

  for(const sec of sections){
    const arr=(currentDeck.cards||[]).filter(c=>sec.filter(c)&&(!q||norm((c.de||'')+' '+c.en+' '+(c.set||'')).includes(q)));
    if(!arr.length)continue;
    const group=document.createElement('div');group.className='group';
    group.innerHTML=`<div class="groupHead">${sec.label}</div>`;
    for(const c of arr){
      const url=imageUrl(c);
      const row=document.createElement('div');row.className='cardRow';
      row.innerHTML=`
        <div class="thumb ${url?'hasImage':'missing'}" ${url?`style="background-image:url('${url.replace(/'/g,'%27')}')"`:''}></div>
        <div>
          <div class="cardName">${esc(c.de||c.en)}</div>
          <div class="cardMeta">${esc(c.set||'Bibliothekskarte')} · ${esc(c.en)}</div>
          ${statusHtml(c)}
        </div>
        <div class="qty"><button data-d="-1">−</button><span>${qty(c)}</span><button data-d="1">+</button></div>`;
      const thumb=row.querySelector('.thumb');
      if(url)thumb.onclick=()=>openViewer(url,c.de||c.en);
      row.querySelectorAll('button').forEach(b=>b.onclick=()=>{
        const id=c.set||keyOf(c);
        quantities[id]=Math.max(0,Math.min(9,qty(c)+Number(b.dataset.d)));
        savePrefs();$('pdfDownload').classList.remove('show');renderCardList();updateStats();
      });
      group.appendChild(row);
    }
    host.appendChild(group);
  }

  if(!(currentDeck.cards||[]).length){
    const empty=document.createElement('div');empty.className='box';
    empty.innerHTML='<div class="pad source">Für dieses Deck sind keine Karten hinterlegt.</div>';
    host.appendChild(empty);
  }
  updateStats();
}
async function enrichDeckMetadata(deck){
  const todo=(deck.cards||[]).filter(c=>!c.de);
  if(!todo.length)return;
  try{
    const r=await fetch(RENDER_SERVER+'/api/metadata',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({cards:todo.map(c=>({key:keyOf(c),set:c.set||'',en:c.en,de:c.de||'',type:c.type||''}))})
    });
    const j=await r.json();
    if(!r.ok)throw Error(j.error||'Metadaten konnten nicht geladen werden.');
    const byKey=new Map((j.cards||[]).map(x=>[x.key,x]));
    for(const c of deck.cards||[]){
      const m=byKey.get(keyOf(c));
      if(m){c.de=m.de||c.de||c.en;c.type=m.type||c.type}
    }
    renderCardList();
  }catch(e){
    console.warn(e);
  }
}

async function showDeck(deck){
  currentDeck=deck;loadQty(deck);
  assetState=new Map();tempSources=new Map();
  $('deckTitle').textContent=deck.name;
  $('deckSource').textContent=sourceText(deck);
  $('pickerName').textContent=deck.name;
  $('pickerMeta').textContent=sourceText(deck);
  $('search').value='';
  savePrefs();
  $('pdfDownload').classList.remove('show');
  renderCardList();
  if(!(currentDeck.cards||[]).length){updateStats();return}
  enrichDeckMetadata(currentDeck);
  await checkAssets();
}
function openPicker(){
  $('sheetBg').classList.add('open');$('deckSearch').value='';renderDeckItems();
}
function closePicker(){$('sheetBg').classList.remove('open')}
function renderDeckItems(){
  const q=norm($('deckSearch').value),host=$('deckItems');host.innerHTML='';
  const filtered=library.decks.filter(d=>!q||norm(d.name+' '+d.category+' '+sourceText(d)).includes(q));
  const groups=[...new Set(filtered.map(d=>d.category||'Decks'))];
  for(const g of groups){
    const h=document.createElement('div');h.className='deckGroupTitle';h.textContent=g;host.appendChild(h);
    for(const d of filtered.filter(x=>(x.category||'Decks')===g)){
      const b=document.createElement('button');b.className='deckItem';
      const count=(d.cards||[]).reduce((a,c)=>a+Number(c.qty||0),0);b.innerHTML=`<b>${esc(d.name)}</b><small>${esc(sourceText(d))} · ${count} Karten</small>`;
      b.onclick=()=>{closePicker();showDeck(d)};
      host.appendChild(b);
    }
  }
}

async function startRender(force=false){
  const target = force
    ? currentCards()
    : currentCards().filter(c=>!['ok','temp'].includes(assetState.get(keyOf(c))?.state));
  if(!target.length)return toast(force?'Keine Karten im Deck zum Neu-Rendern.':'Alle benötigten Karten sind bereits vorhanden.');

  target.forEach(c=>assetState.set(keyOf(c),{state:'rendering'}));
  renderCardList();
  setProgress(.01, force ? 'Neu-Render-Auftrag wird gestartet …' : 'Render-Auftrag wird gestartet …');
  $('renderMissing').disabled=true;
  $('rerenderDeck').disabled=true;

  try{
    const r=await fetch(RENDER_SERVER+'/api/render',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({force, cards:target.map(c=>({key:keyOf(c),set:c.set,en:c.en,de:c.de,type:c.type}))})
    });
    const j=await r.json();
    if(!r.ok)throw Error(j.error||'Render-Auftrag konnte nicht gestartet werden.');
    activeJob=j.id;
    localStorage.setItem('ygo_render_job',activeJob);
    pollJob(activeJob);
  }catch(e){
    activeJob=null;
    target.forEach(c=>assetState.set(keyOf(c),{state:'missing'}));
    renderCardList();
    setProgress(0,'Render-Server nicht erreichbar');
    toast(String(e.message||e),7000);
  }
}
async function pollJob(id){
  if(pollTimer)clearTimeout(pollTimer);
  try{
    const r=await fetch(RENDER_SERVER+'/api/jobs/'+id,{cache:'no-store'});
    const j=await r.json();
    if(!r.ok)throw Error(j.error||'Job nicht gefunden.');
    setProgress(j.progress,j.label);

    for(const cs of (j.cards||[])){
      if(cs.state==='rendering')assetState.set(cs.key,{state:'rendering'});
      if(cs.state==='error')assetState.set(cs.key,{state:'error'});
    }
    renderCardList();

    if(j.state==='queued'||j.state==='running'){
      activeJob=id;
      pollTimer=setTimeout(()=>pollJob(id),900);
      return;
    }
    if(j.state==='error'){
      activeJob=null;localStorage.removeItem('ygo_render_job');
      toast(j.error||'Renderfehler',8000);
      checkAssets();return;
    }

    for(const key of (j.outputs||[])){
      tempSources.set(key,`${RENDER_SERVER}/api/jobs/${id}/cards/${encodeURIComponent(key)}.png`);
      assetState.set(key,{state:'temp'});
    }
    activeJob=null;localStorage.removeItem('ygo_render_job');
    renderCardList();

    if(j.persisted){
      setProgress(1,'Gerendert · GitHub Pages wird aktualisiert …');
      toast('Karten wurden in GitHub gespeichert. Ich prüfe kurz, wann Pages sie ausliefert.');
      for(let n=0;n<30;n++){
        await new Promise(r=>setTimeout(r,2000));
        let remaining=0;
        for(const c of currentCards()){
          const k=keyOf(c);
          if((j.outputs||[]).includes(k)){
            if(j.commitSha)assetRevision.set(k,j.commitSha);
            if(await existsLocal(c,true)){assetState.set(k,{state:'ok'});tempSources.delete(k)}
            else remaining++;
          }
        }
        renderCardList();
        if(!remaining)break;
      }
      setProgress(1,'Archiv aktualisiert');
    }else{
      setProgress(1,'Render fertig · GitHub-Speicherung noch nicht eingerichtet');
      toast('Die Karten sind für diese Sitzung nutzbar, aber noch nicht dauerhaft in GitHub gespeichert.',7000);
    }
    updateStats();
  }catch(e){
    activeJob=null;localStorage.removeItem('ygo_render_job');
    toast(String(e.message||e),7000);checkAssets();
  }
}

function blobToDataURL(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)})}
async function cardData(c){
  const k=keyOf(c);
  const url=assetState.get(k)?.state==='temp'?tempSources.get(k):localUrl(c);
  const r=await fetch(url,{cache:'force-cache'});
  if(!r.ok)throw Error(`${c.de||c.en}: Bild konnte nicht geladen werden.`);
  return await blobToDataURL(await r.blob());
}
function drawMarks(doc,cfg,sx,sy,cw,ch){
  if($('marks').value!=='1')return;
  const gap=.7,mark=2;
  doc.setLineWidth(.08);
  for(let i=0;i<=cfg.cols;i++){
    const x=sx+i*cw;
    doc.line(x,sy-gap-mark,x,sy-gap);
    doc.line(x,sy+cfg.rows*ch+gap,x,sy+cfg.rows*ch+gap+mark);
  }
  for(let i=0;i<=cfg.rows;i++){
    const y=sy+i*ch;
    doc.line(sx-gap-mark,y,sx-gap,y);
    doc.line(sx+cfg.cols*cw+gap,y,sx+cfg.cols*cw+gap+mark,y);
  }
}

async function clearArchive(){
  if(activeJob){
    toast('Während eines Render-Auftrags kann das Archiv nicht geleert werden.');
    return;
  }

  const first=confirm(
    'Wirklich das gesamte Kartenarchiv löschen?\n\n' +
    'Alle PNGs unter cards/ werden aus GitHub entfernt. ' +
    'Decklisten und die App bleiben erhalten.'
  );
  if(!first)return;

  const second=confirm(
    'Letzte Bestätigung:\n\n' +
    'Danach müssen die Karten neu gerendert werden.'
  );
  if(!second)return;

  $('clearArchive').disabled=true;
  $('renderMissing').disabled=true;
  $('rerenderDeck').disabled=true;
  $('makePdf').disabled=true;
  setProgress(.08,'Kartenarchiv wird aus GitHub gelöscht …');

  try{
    const r=await fetch(RENDER_SERVER+'/api/archive/clear',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({confirm:'DELETE CARDS'})
    });
    const j=await r.json();
    if(!r.ok)throw Error(j.error||'Archiv konnte nicht gelöscht werden.');

    tempSources.clear();
    assetState.clear();
    assetRevision.clear();

    setProgress(.7, j.deleted
      ? `${j.deleted} Karten gelöscht · GitHub Pages aktualisiert …`
      : 'Archiv war bereits leer');

    toast(j.message || 'Kartenarchiv geleert.',6500);

    // GitHub Pages/CDN braucht meist etwas Zeit. Danach komplette Prüfung neu starten.
    await new Promise(r=>setTimeout(r,3500));
    await checkAssets();
  }catch(e){
    setProgress(0,'Archiv löschen fehlgeschlagen');
    toast(String(e.message||e),8000);
    updateStats();
  }finally{
    $('clearArchive').disabled=false;
  }
}

async function makePdf(){
  const cards=currentCards();
  if(cards.some(c=>!['ok','temp'].includes(assetState.get(keyOf(c))?.state)))return toast('Es fehlen noch Kartenbilder.');
  const all=copies(),cfg=layouts[$('layout').value],{jsPDF}=window.jspdf;
  const orientation=cfg.w>cfg.h?'landscape':'portrait';
  const doc=new jsPDF({orientation,unit:'mm',format:[cfg.w,cfg.h],compress:true});
  const cw=59,ch=86,cap=cfg.cols*cfg.rows,pages=Math.ceil(all.length/cap);
  const cache=new Map();

  for(let p=0;p<pages;p++){
    if(p>0)doc.addPage([cfg.w,cfg.h],orientation);
    const sx=(cfg.w-cfg.cols*cw)/2,sy=(cfg.h-cfg.rows*ch)/2;
    const chunk=all.slice(p*cap,(p+1)*cap);
    for(let i=0;i<chunk.length;i++){
      const c=chunk[i],k=keyOf(c);
      setProgress((p*cap+i)/all.length,`PDF · Karte ${p*cap+i+1}/${all.length}: ${c.de||c.en}`);
      if(!cache.has(k))cache.set(k,await cardData(c));
      const row=Math.floor(i/cfg.cols),col=i%cfg.cols;
      doc.addImage(cache.get(k),'PNG',sx+col*cw,sy+row*ch,cw,ch,k,'FAST');
    }
    drawMarks(doc,cfg,sx,sy,cw,ch);
  }
  setProgress(.98,'PDF wird vorbereitet …');
  const filename=`${currentDeck.id}_${$('layout').value}_450dpi.pdf`;
  const blob=doc.output('blob');
  if(pdfBlobUrl)URL.revokeObjectURL(pdfBlobUrl);
  pdfBlobUrl=URL.createObjectURL(blob);
  const link=$('pdfDownload');
  link.href=pdfBlobUrl;
  link.download=filename;
  link.classList.add('show');
  link.textContent='PDF öffnen / herunterladen';
  setProgress(1,'PDF fertig · unten auf „PDF öffnen / herunterladen“ tippen');
  toast('PDF ist fertig. Über den neuen Button kannst du sie öffnen bzw. auf dem iPhone speichern.',6500);
}

async function checkServerHealth(){
  const serverPill=$('serverPill'),tokenPill=$('tokenPill');
  const serverState=$('serverState'),tokenState=$('tokenState');
  serverPill.classList.remove('ok','warn','bad');
  tokenPill.classList.remove('ok','warn','bad');
  serverState.textContent='prüfen …';
  tokenState.textContent='prüfen …';

  try{
    const r=await fetch(RENDER_SERVER+'/health',{cache:'no-store',signal:AbortSignal.timeout(12000)});
    const j=await r.json();
    if(!r.ok || !j.ok)throw Error('Server meldet Fehler');

    serverState.textContent=`läuft · ${j.version||'?'}`;
    serverPill.classList.add('ok');

    if(j.githubStatus==='ok'){
      tokenState.textContent='Schreibzugriff ✓';
      tokenPill.classList.add('ok');
    }else if(j.githubStatus==='connected'){
      tokenState.textContent='verbunden';
      tokenPill.classList.add('warn');
    }else if(j.githubStatus==='error'){
      tokenState.textContent='Fehler';
      tokenPill.classList.add('bad');
    }else{
      tokenState.textContent='fehlt';
      tokenPill.classList.add('warn');
    }
  }catch(e){
    serverState.textContent='nicht erreichbar';
    serverPill.classList.add('bad');
    tokenState.textContent='unbekannt';
    tokenPill.classList.add('warn');
  }
}

async function init(){
  checkServerHealth();
  setInterval(checkServerHealth,60000);

  $('layout').value=localStorage.getItem('ygo_layout')||'a3safe';
  $('marks').value=localStorage.getItem('ygo_marks')||'1';
  $('layout').onchange=()=>{savePrefs();$('pdfDownload').classList.remove('show')};$('marks').onchange=()=>{savePrefs();$('pdfDownload').classList.remove('show')};
  $('viewer').onclick=closeViewer;
  $('deckPicker').onclick=openPicker;$('sheetBg').onclick=closePicker;$('deckSearch').oninput=renderDeckItems;
  $('search').oninput=renderCardList;$('renderMissing').onclick=()=>startRender(false);$('rerenderDeck').onclick=()=>startRender(true);$('clearArchive').onclick=clearArchive;$('makePdf').onclick=makePdf;

  try{
    const r=await fetch('decks.json',{cache:'no-store'});
    library=await r.json();
    const wanted=localStorage.getItem('ygo_deck');
    await showDeck(library.decks.find(d=>d.id===wanted)||library.decks[0]);
  }catch(e){
    setProgress(0,'decks.json konnte nicht geladen werden');
    toast(String(e.message||e),8000);
  }

  const job=localStorage.getItem('ygo_render_job');
  if(job){activeJob=job;pollJob(job)}
}
init();
</script>
