<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>YGO Battle Box Print</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{--bg:#0e1116;--p:#171c24;--p2:#202733;--l:#313a49;--t:#f4f6f8;--m:#9da8b8;--a:#e8c56a;--ok:#63d69a;--w:#f0b45c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}.app{max-width:800px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(92px + env(safe-area-inset-bottom))}h1{font-size:28px;margin:4px 0}.sub,.note,.meta{color:var(--m)}.sub{font-size:13px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.pill{border:1px solid var(--l);background:var(--p);border-radius:999px;padding:7px 10px;font-size:12px}.box{background:var(--p);border:1px solid var(--l);border-radius:16px;margin:12px 0;overflow:hidden}.controls{padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;color:var(--m);font-size:11px;margin-bottom:5px}select,input{width:100%;background:var(--p2);border:1px solid var(--l);border-radius:11px;color:white;padding:11px}.row{display:grid;grid-template-columns:45px 1fr auto;gap:10px;align-items:center;padding:9px 11px;border-top:1px solid var(--l)}.thumb{width:42px;height:61px;border:1px solid var(--l);border-radius:5px;background:#090c10 center/cover no-repeat;position:relative}.dot{position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-radius:50%;background:#56606f}.name{font-weight:650;font-size:14px}.meta{font-size:11px;margin-top:3px}.step{display:flex;align-items:center;gap:5px}.step button{width:31px;height:31px;border:1px solid var(--l);border-radius:9px;background:var(--p2);color:#fff;font-size:19px}.n{width:20px;text-align:center;font-weight:700}.section{padding:11px 13px;font-weight:700;background:rgba(255,255,255,.025)}.actions{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(14,17,22,.94);backdrop-filter:blur(18px);border-top:1px solid var(--l)}.actions>div{max-width:800px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:13px;padding:13px;font-weight:750}.pri{background:var(--a);color:#18130a}.sec{background:var(--p2);color:#fff;border:1px solid var(--l)}.note{font-size:12px;line-height:1.45;margin-top:10px}.progress{height:5px;background:#2a303a;border-radius:6px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:var(--a)}.hidden{display:none}.ok{color:var(--ok)}.warn{color:var(--w)}dialog{background:var(--p);color:#fff;border:1px solid var(--l);border-radius:16px;width:calc(100% - 28px);max-width:420px;padding:18px}dialog::backdrop{background:rgba(0,0,0,.65)}dialog button{width:100%;margin-top:12px}
</style>
</head>
<body>
<div class="app">
<div class="sub">CLASSIC BATTLE BOX · V1</div><h1 id="title">Dragon's Roar</h1><div class="sub" id="subtitle">SD1 · 2005 · 59 × 86 mm</div>
<div class="bar"><div class="pill">Deck: <b id="total">40</b></div><div class="pill">DE-Bilder: <b id="de">0/28</b></div><div class="pill">Seiten: <b id="pages">3</b></div></div>
<div class="box controls"><div class="grid"><div><label>Format</label><select id="layout"><option value="a3safe">A3 sicher · 18/Bogen</option><option value="a3tight">A3 maximal · 21/Bogen</option><option value="sra3">SRA3 · 25/Bogen</option></select></div><div><label>Schnittmarken</label><select id="marks"><option value="1">An</option><option value="0">Aus</option></select></div></div><div class="note">PDF: echte Seitengröße, Karten exakt <b>59 × 86 mm</b>. Copyshop: <b>100 % / Tatsächliche Größe</b>.</div><div id="prog" class="progress hidden"><i></i></div><div id="progText" class="note hidden"></div></div>
<input id="search" placeholder="Karte suchen …">
<div id="list"></div>
</div>
<div class="actions"><div><button class="btn sec" id="images">Bilder laden</button><button class="btn pri" id="pdf">PDF erstellen</button></div></div>
<dialog id="msg"><div id="msgText"></div><button class="btn pri" id="closeMsg">OK</button></dialog>
<script>
var deck={"id":"sd1-dragons-roar","name":"Dragon's Roar","subtitle":"Structure Deck SD1 · Deutsch · 01.01.2005","source":"Konami Yu-Gi-Oh! Neuron / Structure Deck SD1","galleryPage":"Set Card Galleries:Structure Deck - Dragon's Roar (TCG-DE-1E)","cards":[{"set":"SD1-DE001","en":"Red-Eyes Darkness Dragon","de":"Rotäugiger Finsterer Drache","type":"Monster","qty":1,"rarity":"UR"},{"set":"SD1-DE002","en":"Red-Eyes Black Dragon","de":"Rotäugiger schwarzer Drache","type":"Monster","qty":1,"rarity":"C"},{"set":"SD1-DE003","en":"Luster Dragon","de":"Schimmerdrache","type":"Monster","qty":2,"rarity":"C"},{"set":"SD1-DE004","en":"Twin-Headed Behemoth","de":"Zweiköpfiger Behemoth","type":"Monster","qty":1,"rarity":"C"},{"set":"SD1-DE005","en":"Armed Dragon LV3","de":"Bewaffneter Drache LV3","type":"Monster","qty":2,"rarity":"C"},{"set":"SD1-DE006","en":"Armed Dragon LV5","de":"Bewaffneter Drache LV5","type":"Monster","qty":2,"rarity":"C"},{"set":"SD1-DE007","en":"Black Dragon's Chick","de":"Schwarzes Drachenküken","type":"Monster","qty":1,"rarity":"C"},{"set":"SD1-DE008","en":"Element Dragon","de":"Elementardrache","type":"Monster","qty":1,"rarity":"C"},{"set":"SD1-DE009","en":"Masked Dragon","de":"Maskierter Drache","type":"Monster","qty":3,"rarity":"C"},{"set":"SD1-DE010","en":"Snatch Steal","de":"Schnappstahl","type":"Zauber","qty":1,"rarity":"C"},{"set":"SD1-DE011","en":"Mystical Space Typhoon","de":"Mystischer Raum-Taifun","type":"Zauber","qty":1,"rarity":"C"},{"set":"SD1-DE012","en":"Nobleman of Crossout","de":"Adliger der Auslöschung","type":"Zauber","qty":2,"rarity":"C"},{"set":"SD1-DE013","en":"Premature Burial","de":"Voreiliges Begräbnis","type":"Zauber","qty":1,"rarity":"C"},{"set":"SD1-DE014","en":"Swords of Revealing Light","de":"Verräterische Schwerter","type":"Zauber","qty":1,"rarity":"C"},{"set":"SD1-DE015","en":"Pot of Greed","de":"Topf der Gier","type":"Zauber","qty":1,"rarity":"C"},{"set":"SD1-DE016","en":"Heavy Storm","de":"Schwerer Sturm","type":"Zauber","qty":1,"rarity":"C"},{"set":"SD1-DE017","en":"Stamping Destruction","de":"Stampfende Zerstörung","type":"Zauber","qty":3,"rarity":"C"},{"set":"SD1-DE018","en":"Creature Swap","de":"Kreaturentausch","type":"Zauber","qty":2,"rarity":"C"},{"set":"SD1-DE019","en":"Reload","de":"Nachladen","type":"Zauber","qty":2,"rarity":"C"},{"set":"SD1-DE020","en":"The Graveyard in the Fourth Dimension","de":"Friedhof in der Vierten Dimension","type":"Zauber","qty":1,"rarity":"C"},{"set":"SD1-DE021","en":"Call of the Haunted","de":"Ruf der Gejagten","type":"Falle","qty":1,"rarity":"C"},{"set":"SD1-DE022","en":"Ceasefire","de":"Waffenstillstand","type":"Falle","qty":1,"rarity":"C"},{"set":"SD1-DE023","en":"The Dragon's Bead","de":"Perle des Drachen","type":"Falle","qty":1,"rarity":"C"},{"set":"SD1-DE024","en":"Dragon's Rage","de":"Drachenzorn","type":"Falle","qty":2,"rarity":"C"},{"set":"SD1-DE025","en":"Reckless Greed","de":"Tollkühne Gier","type":"Falle","qty":1,"rarity":"C"},{"set":"SD1-DE026","en":"Interdimensional Matter Transporter","de":"Interdimensionaler Materietransporter","type":"Falle","qty":2,"rarity":"C"},{"set":"SD1-DE027","en":"Trap Jammer","de":"Fallenfalle","type":"Falle","qty":1,"rarity":"C"},{"set":"SD1-DE028","en":"Curse of Anubis","de":"Fluch des Anubis","type":"Falle","qty":1,"rarity":"C"}]}, imageMap=new Map(), galleryMap=null, dbp=null;
var cfgs={a3safe:{w:420,h:297,c:6,r:3,o:'landscape'},a3tight:{w:420,h:297,c:7,r:3,o:'landscape'},sra3:{w:320,h:450,c:5,r:5,o:'portrait'}};
function norm(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/gi,'').toLowerCase()}
function total(){return deck.cards.reduce(function(a,c){return a+c.qty},0)}
function instances(){var a=[];deck.cards.forEach(function(c){for(var i=0;i<c.qty;i++)a.push(c)});return a}
function save(){var s={};deck.cards.forEach(function(c){s[c.set]=c.qty});localStorage.setItem('ygo-v1',JSON.stringify(s))}
function msg(t){document.getElementById('msgText').innerHTML=t;document.getElementById('msg').showModal()}
function progress(on,p,t){document.getElementById('prog').classList.toggle('hidden',!on);document.getElementById('progText').classList.toggle('hidden',!on);document.querySelector('#prog i').style.width=(p*100)+'%';document.getElementById('progText').textContent=t||''}
function openDB(){if(dbp)return dbp;dbp=new Promise(function(res,rej){var r=indexedDB.open('ygo-print-v1',1);r.onupgradeneeded=function(){r.result.createObjectStore('images')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}});return dbp}
async function getImg(k){var db=await openDB();return await new Promise(function(res,rej){var r=db.transaction('images','readonly').objectStore('images').get(k);r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
async function putImg(k,v){var db=await openDB();return await new Promise(function(res,rej){var r=db.transaction('images','readwrite').objectStore('images').put(v,k);r.onsuccess=function(){res()};r.onerror=function(){rej(r.error)}})}
async function blob(url){var r=await fetch(url,{mode:'cors',cache:'force-cache'});if(!r.ok)throw Error('HTTP '+r.status);var b=await r.blob();if(!b.type.startsWith('image/'))throw Error('kein Bild');return b}
async function gallery(){if(galleryMap)return galleryMap;galleryMap=new Map();var api='https://yugioh.fandom.com/api.php';var q=new URLSearchParams({action:'query',format:'json',origin:'*',titles:deck.galleryPage,prop:'images',imlimit:'max'});var j=await (await fetch(api+'?'+q)).json();var page=Object.values(j.query.pages)[0];var titles=(page.images||[]).map(function(x){return x.title}).filter(function(x){return /SD1-DE/i.test(x)});for(var i=0;i<titles.length;i+=40){var p=new URLSearchParams({action:'query',format:'json',origin:'*',prop:'imageinfo',iiprop:'url',titles:titles.slice(i,i+40).join('|')});var jj=await (await fetch(api+'?'+p)).json();Object.values(jj.query.pages).forEach(function(pg){var u=pg.imageinfo&&pg.imageinfo[0]&&pg.imageinfo[0].url;if(u){var n=(pg.title||'').replace(/^File:/,'').split('-SD1-DE')[0];galleryMap.set(norm(n),u)}})}return galleryMap}
async function fallback(c){var u='https://db.ygoprodeck.com/api/v7/cardinfo.php?name='+encodeURIComponent(c.en);var j=await (await fetch(u)).json();return j.data[0].card_images[0].image_url}
async function resolve(c){if(imageMap.has(c.set))return imageMap.get(c.set);var ca=await getImg('b:'+c.set),me=await getImg('m:'+c.set);if(ca&&me){var x={b:ca,k:me.k,u:URL.createObjectURL(ca)};imageMap.set(c.set,x);return x}try{var g=await gallery(),u=g.get(norm(c.en));if(u){var b=await blob(u);await putImg('b:'+c.set,b);await putImg('m:'+c.set,{k:'de'});var x={b:b,k:'de',u:URL.createObjectURL(b)};imageMap.set(c.set,x);return x}}catch(e){}var fu=await fallback(c),fb=await blob(fu);await putImg('b:'+c.set,fb);await putImg('m:'+c.set,{k:'fallback'});var y={b:fb,k:'fallback',u:URL.createObjectURL(fb)};imageMap.set(c.set,y);return y}
function render(){document.getElementById('total').textContent=total();var q=norm(document.getElementById('search').value),host=document.getElementById('list');host.innerHTML='';['Monster','Zauber','Falle'].forEach(function(t){var cards=deck.cards.filter(function(c){return c.type===t&&(!q||norm(c.de+c.en+c.set).includes(q))});if(!cards.length)return;var box=document.createElement('div');box.className='box';box.innerHTML='<div class="section">'+(t==='Falle'?'Fallen':t)+'</div>';cards.forEach(function(c){var im=imageMap.get(c.set),row=document.createElement('div');row.className='row';row.innerHTML='<div class="thumb" style="'+(im?'background-image:url('+im.u+')':'')+'"><span class="dot" style="background:'+(im?(im.k==='de'?'var(--ok)':'var(--w)'):'#56606f')+'"></span></div><div><div class="name">'+c.de+'</div><div class="meta">'+c.set+' · '+c.en+'</div></div><div class="step"><button data-d="-1">−</button><span class="n">'+c.qty+'</span><button data-d="1">+</button></div>';row.querySelectorAll('button').forEach(function(b){b.onclick=function(){c.qty=Math.max(0,Math.min(9,c.qty+Number(b.dataset.d)));save();render();updatePages()}});box.appendChild(row)});host.appendChild(box)});updateCounts()}
function updatePages(){var c=cfgs[document.getElementById('layout').value];document.getElementById('pages').textContent=Math.ceil(total()/(c.c*c.r))}
function updateCounts(){var n=0;imageMap.forEach(function(x){if(x.k==='de')n++});document.getElementById('de').textContent=n+'/'+deck.cards.length}
async function loadAll(){var fail=0;for(var i=0;i<deck.cards.length;i++){progress(true,(i+1)/deck.cards.length,(i+1)+'/'+deck.cards.length+' · '+deck.cards[i].de);try{await resolve(deck.cards[i])}catch(e){fail++}render()}progress(false);var f=0;imageMap.forEach(function(x){if(x.k==='fallback')f++});msg('<b>Bildprüfung fertig.</b><br><br><span class="ok">'+(deck.cards.length-f-fail)+' deutsche Bilder</span><br><span class="warn">'+f+' Fallback-Bilder</span><br>'+fail+' fehlend.')}
function dataURL(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(b)})}
function marks(pdf,c,sx,sy,cw,ch){var g=.65,m=2,R=sx+c.c*cw,B=sy+c.r*ch;pdf.setLineWidth(.15);for(var i=0;i<=c.c;i++){var x=sx+i*cw;pdf.line(x,sy-g-m,x,sy-g);pdf.line(x,B+g,x,B+g+m)}for(var j=0;j<=c.r;j++){var y=sy+j*ch;pdf.line(sx-g-m,y,sx-g,y);pdf.line(R+g,y,R+g+m,y)}}
async function makePDF(){try{var active=deck.cards.filter(function(c){return c.qty>0});for(var i=0;i<active.length;i++){progress(true,(i+1)/active.length,'Bilder prüfen · '+active[i].de);await resolve(active[i])}var c=cfgs[document.getElementById('layout').value],cards=instances(),cap=c.c*c.r,jsPDF=window.jspdf.jsPDF,pdf=new jsPDF({orientation:c.o,unit:'mm',format:[c.w,c.h],compress:true});var cw=59,ch=86,sx=(c.w-c.c*cw)/2,sy=(c.h-c.r*ch)/2,pc=Math.ceil(cards.length/cap),fallbacks=0,done=0;for(var pg=0;pg<pc;pg++){if(pg)pdf.addPage([c.w,c.h],c.o);var chunk=cards.slice(pg*cap,(pg+1)*cap);for(var s=0;s<chunk.length;s++){var rr=Math.floor(s/c.c),cc=s%c.c,im=imageMap.get(chunk[s].set);if(im.k==='fallback')fallbacks++;var d=await dataURL(im.b),fmt=im.b.type.includes('png')?'PNG':'JPEG';pdf.addImage(d,fmt,sx+cc*cw,sy+rr*ch,cw,ch,undefined,'FAST');done++;progress(true,done/cards.length,'PDF · '+done+'/'+cards.length)}if(document.getElementById('marks').value==='1')marks(pdf,c,sx,sy,cw,ch)}var out=pdf.output('blob'),a=document.createElement('a');a.href=URL.createObjectURL(out);a.download='Dragons_Roar_'+document.getElementById('layout').value+'_59x86mm.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){progress(false)},500);msg('<b>PDF erstellt.</b><br><br>'+(fallbacks?'<span class="warn">'+fallbacks+' Kartenkopien nutzen noch Fallback-Bilder.</span>':'<span class="ok">Alle Bilder deutsch.</span>')+'<br><br>Drucken: <b>100 % / Tatsächliche Größe</b>.')}catch(e){progress(false);msg('<b>PDF nicht erstellt.</b><br><br>'+e.message)}}
async function init(){var s=JSON.parse(localStorage.getItem('ygo-v1')||'{}');deck.cards.forEach(function(c){if(Number.isFinite(s[c.set]))c.qty=s[c.set]});document.getElementById('title').textContent=deck.name;document.getElementById('subtitle').textContent=deck.subtitle+' · 59 × 86 mm';for(var i=0;i<deck.cards.length;i++){var b=await getImg('b:'+deck.cards[i].set),m=await getImg('m:'+deck.cards[i].set);if(b&&m)imageMap.set(deck.cards[i].set,{b:b,k:m.k,u:URL.createObjectURL(b)})}render();updatePages()}
document.getElementById('images').onclick=loadAll;document.getElementById('pdf').onclick=makePDF;document.getElementById('search').oninput=render;document.getElementById('layout').onchange=updatePages;document.getElementById('closeMsg').onclick=function(){document.getElementById('msg').close()};init();
</script>
</body></html>
